<script>requireLazy(["PolarisEmbedSimple"],function(){PolarisEmbedSimple.init([{"isRichEmbed":false,"isProfileEmbed":true,"contextJSON":"{\"context\":{\"username\":\"nasa\",\"full_name\":\"NASA\",\"posts_count\":4984,\"graphql_media\":[{\"shortcode_media\":{\"__typename\":\"GraphVideo\",\"id\":\"4018862241843028636\",\"shortcode\":\"DfF3eqGSKKc\",\"is_video\":true,\"taken_at_timestamp\":1793306135,\"dimensions\":{\"height\":1280,\"width\":720},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t51.82787-15/865204930_18640535563026724_3353517023594775034_n.jpg\",\"owner\":{\"id\":\"528817151\",\"username\":\"nasa\"},\"edge_media_to_caption\":{\"edges\":[{\"node\":{\"text\":\"More power loading. 🔋\\n\\nToday, NASA astronaut Anil Menon and CSA (Canadian Space Agency) astronaut Joshua Kutryk conducted a spacewalk to install the 7th of 8 new roll out solar arrays. The final new array is slated to be installed during the Nov. 5 spacewalk, increasing the station’s available power by up to 30%.\"}}]}}},{\"shortcode_media\":{\"__typename\":\"GraphSidecar\",\"id\":\"4018120244338617968\",\"shortcode\":\"DfDOxLEm-5w\",\"is_video\":false,\"taken_at_timestamp\":1793217281,\"dimensions\":{\"height\":720,\"width\":1080},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t39.30808-6/870306402_122241453764723345_6296168424552001998_n.jpg\",\"owner\":{\"id\":\"528817151\",\"username\":\"nasa\"},\"edge_media_to_caption\":{\"edges\":[{\"node\":{\"text\":\"Welcome to the Oval Office, Artemis III Crew! 🇺🇸🚀\"}}]},\"edge_sidecar_to_children\":{\"edges\":[{\"node\":{\"__typename\":\"GraphImage\",\"id\":\"4018120230757406775\",\"shortcode\":\"DfDOw-bGxg3\",\"is_video\":false,\"dimensions\":{\"height\":720,\"width\":1080},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t39.30808-6/870306402_122241453764723345_6296168424552001998_n.jpg\"}},{\"node\":{\"__typename\":\"GraphImage\",\"id\":\"4018120230866489172\",\"shortcode\":\"DfDOw-hm49U\",\"is_video\":false,\"dimensions\":{\"height\":720,\"width\":1080},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t39.30808-6/867890400_122241453728723345_2949399353146026950_n.jpg\"}}]}}},{\"shortcode_media\":{\"__typename\":\"GraphImage\",\"id\":\"4017953995096374853\",\"shortcode\":\"DfCo97ZlL5F\",\"is_video\":false,\"taken_at_timestamp\":1793197470,\"dimensions\":{\"height\":1080,\"width\":1080},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t51.82787-15/870167702_18663198346049152_3666677082777600970_n.jpg\",\"owner\":{\"id\":\"528817151\",\"username\":\"nasa\"},\"edge_media_to_caption\":{\"edges\":[{\"node\":{\"text\":\"Fire burn and cauldron bubble 🫧\\n\\nThe @NASAWebb telescope spotted stars brewing in this cosmic site of toil and trouble. This region, named N159, is 161,000 light-years from Earth in the Large Magellanic Cloud, a satellite galaxy of our Milky Way.\\n\\n#Nebula #Stars #Cauldron\"}}]}}},{\"shortcode_media\":{\"__typename\":\"GraphImage\",\"id\":\"4017307697947295168\",\"shortcode\":\"DfAWBERlz3A\",\"is_video\":false,\"taken_at_timestamp\":1793120423,\"dimensions\":{\"height\":1048,\"width\":1080},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t51.82787-15/868381587_18662864662049152_2543695975749519193_n.jpg\",\"owner\":{\"id\":\"528817151\",\"username\":\"nasa\"},\"edge_media_to_caption\":{\"edges\":[{\"node\":{\"text\":\"Wow, so edgy 😎\\n\\n@NASAHubble caught this edge-on spiral galaxy, located roughly 37 million light-years away in the constellation Columba (the Dove). Hubble studies low-mass galaxies like this one to improve our understanding of the universe.\"}}]}}},{\"shortcode_media\":{\"__typename\":\"GraphImage\",\"id\":\"4016549113173049618\",\"shortcode\":\"De9piNJlwES\",\"is_video\":false,\"taken_at_timestamp\":1793029994,\"dimensions\":{\"height\":1080,\"width\":1080},\"display_url\":\"https://instagram.ftpa1-2.fna.fbcdn.net/v/t51.82787-15/869161815_18662481523049152_2557062500569584515_n.jpg\",\"owner\":{\"id\":\"52
