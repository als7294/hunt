[project]
name = "hunt-osint"
version = "0.1.0"
description = "Local-first OSINT investigation tool: one search, every source, the right person, with proof."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "geoclip>=1.3.0",
    "imageio-ffmpeg>=0.7.0",
    "maigret>=0.6.6",
    "nicknames>=1.0.1",
    "phonenumbers>=9.0.42",
    "playwright>=1.64.1",
    "pyobjc-framework-vision>=12.2.2 ; sys_platform == 'darwin'",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "reverse-geocoder>=1.5.1",
    "starlette>=1.10.0",
    "user-scanner>=1.5.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
hunt = "hunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hunt"]

# Hunt Capture is loaded from <site-packages>/extension (browser.SOURCE); without this an installed Hunt has no
# extension. Safe at the top level: `uv tool install` gives Hunt an environment of its own. (docs/qol.md)
[tool.hatch.build.targets.wheel.force-include]
"extension" = "extension"
