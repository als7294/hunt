[project]
name = "tessera"
version = "0.1.0"
description = "Local-first OSINT investigation tool: one search, every source, the right person, with proof."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "maigret>=0.6.6",
    "nicknames>=1.0.1",
    "phonenumbers>=9.0.42",
    "playwright>=1.64.1",
    "rapidfuzz>=3.14.6",
    "user-scanner>=1.5.2.3",
]

[project.scripts]
tessera = "tessera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
